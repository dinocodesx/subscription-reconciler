services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subscription_reconciler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_reconciler"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/subscription_reconciler?sslmode=disable
      SELF_BASE_URL: http://127.0.0.1:8080
      CARRIER_POLL_INTERVAL: 5m
      NOTIFICATION_INTERVAL: 15s
    ports:
      - "8080:8080"

volumes:
  postgres_data:
